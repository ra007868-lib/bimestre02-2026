<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de fornecedores</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <form aria-label="Cadastro de fornecedores" onsubmit="event.preventDefault()">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome Fantasia ou primeiro nome</label>
          <input type="text" id="nome" name="nome" class="form-control">
        </div>
        <fieldset class="col-md-6">
          <legend class="form-label fs-6">Pessoa</legend>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pessoa" id="fisica" value="fisica">
            <label class="form-check-label" for="fisica">Física</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pessoa" id="juridica" value="juridica">
            <label class="form-check-label" for="juridica">Jurídica</label>
          </div>
        </fieldset>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label for="razao" class="form-label">Razão</label>
          <input type="text" id="razao" name="razao" class="form-control">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="cnpj" class="form-label">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" class="form-control" placeholder="00.000.000/0000-00">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" id="endereco" name="endereco" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="bairro" class="form-label">Bairro</label>
          <input type="text" id="bairro" name="bairro" class="form-control">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="cidade" class="form-label">Cidade</label>
          <input type="text" id="cidade" name="cidade" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="estado" class="form-label">Estado</label>
          <select class="form-select" name="estado" id="estado">
            <option>Acre</option>
            <option>Alagoas</option>
            <option>Amapá</option>
            <option>Amazonas</option>
            <option>Bahia</option>
            <option>Ceará</option>
            <option>Distrito Federal</option>
            <option>Espírito Santo</option>
            <option>Goiás</option>
            <option>Maranhão</option>
            <option>Mato Grosso</option>
            <option>Mato Grosso do Sul</option>
            <option selected>Minas Gerais</option>
            <option>Pará</option>
            <option>Paraíba</option>
            <option>Paraná</option>
            <option>Pernambuco</option>
            <option>Piauí</option>
            <option>Rio de Janeiro</option>
            <option>Rio Grande do Norte</option>
            <option>Rio Grande do Sul</option>
            <option>Rondônia</option>
            <option>Roraima</option>
            <option>Santa Catarina</option>
            <option>São Paulo</option>
            <option>Sergipe</option>
            <option>Tocantins</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="cep" class="form-label">CEP</label>
          <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="tel" id="telefone" name="telefone" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="celular" class="form-label">Celular</label>
          <input type="tel" id="celular" name="celular" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="fax" class="form-label">Fax</label>
          <input type="tel" id="fax" name="fax" class="form-control">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="contato" class="form-label">Contato</label>
          <input type="text" id="contato" name="contato" class="form-control">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" name="email" class="form-control">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="avisos" name="avisos" checked>
            <label class="form-check-label" for="avisos">Receber e-mails de aviso sobre novas licitações</label>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <fieldset class="col-md-12">
          <legend class="form-label fs-6">Tipo de empresa</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tipoEmpresa" id="pequenoPorte" value="pequenoPorte">
            <label class="form-check-label" for="pequenoPorte">MICRO EMPRESAS / EMPRESAS DE PEQUENO PORTE</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tipoEmpresa" id="demais" value="demais">
            <label class="form-check-label" for="demais">DEMAIS FORMAS DE CONSTITUIÇÃO</label>
          </div>
        </fieldset>
      </div>

      <div class="text-end">
        <button class="btn btn-primary" type="submit">Salvar cadastro</button>
      </div>
    </form>
    <p class="mt-4">ATENÇÃO: Este cadastro não substitui o cadastro de fornecedores do município de São Sebastião do Paraíso</p>
  </main>
</body>
</html>
